##### Terminal Compatibility #####
set -g default-terminal "xterm-256color"
set-option -sa terminal-overrides ",xterm-256color:RGB"
set -g mouse on

##### Prefix Key (optional) #####
# Change prefix to Option+a instead of Ctrl+B
set -g prefix M-a

##### Option (⌥) Key Bindings — macOS-style #####
# Pane Management
bind -n M-d split-window -h -c "#{pane_current_path}"       # ⌥+d = vertical split
bind -n M-D split-window -v -c "#{pane_current_path}"       # ⌥+⇧+d = horizontal split
bind -n M-w kill-pane                                       # ⌥+w = close current pane

# Pane Navigation
bind -n M-[ select-pane -t :.-                              # ⌥+[ = previous pane
bind -n M-] select-pane -t :.+                              # ⌥+] = next pane
bind -n M-h select-pane -L                                  # ⌥+h = left pane
bind -n M-j select-pane -D                                  # ⌥+j = down pane
bind -n M-k select-pane -U                                  # ⌥+k = up pane
bind -n M-l select-pane -R                                  # ⌥+l = right pane

# Window Management
bind -n M-\{ previous-window                                # ⌥+⇧+[ = previous window
bind -n M-\} next-window                                    # ⌥+⇧+] = next window
bind -n M-t new-window                                      # ⌥+t = new window
bind -n M-n new-session                                     # ⌥+n = new session

##### Optional: Window switching with ⌥+1 through ⌥+9
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

##### Quality of Life #####
# Reload config easily
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."
bind -n M-s choose-session   # ⌥+s to switch sessions interactively

# Use Vim-style selection/copy
setw -g mode-keys vi

##### Theme (optional, requires TPM) #####
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "nordtheme/tmux"

# Initialize TPM (keep this at the bottom) - next 2 lines are for install
# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# tmux source ~/.tmux.conf
run '~/.tmux/plugins/tpm/tpm'
